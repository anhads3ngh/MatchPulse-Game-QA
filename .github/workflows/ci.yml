name: Quality engineering CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run 43 unit and API contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q main.py engine.py
